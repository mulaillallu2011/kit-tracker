<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kit Business Tracker — Kit Catalogue &amp; Student Sync</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6">
          <rect x="4" y="4" width="16" height="16" rx="2"/>
          <circle cx="8" cy="8" r="1.1" fill="#fff" stroke="none"/>
          <circle cx="16" cy="8" r="1.1" fill="#fff" stroke="none"/>
          <circle cx="8" cy="16" r="1.1" fill="#fff" stroke="none"/>
          <circle cx="16" cy="16" r="1.1" fill="#fff" stroke="none"/>
          <path d="M8 8v3h8v-3M8 16v-3"/>
        </svg>
        <div class="brand-title">Kit Tracker</div>
      </div>
      <div class="brand-sub">Electronics &amp; Robotics kits</div>
      <div class="brand-sub" id="roleBadge" style="margin-top:7px;font-weight:600;"></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <button class="side-tool-btn" id="settingsBtn" type="button">⚙️ <span>Settings</span></button>
      <button class="appearance-btn" id="appearanceBtn" type="button" aria-label="Change appearance">
        <span class="appearance-label">
          <svg class="appearance-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.8 6.8 0 0 0 21 12.8Z"/>
          </svg>
          <span id="appearanceText">Dark mode</span>
        </span>
        <span class="mono" id="appearanceState">OFF</span>
      </button>
      <button class="reset-btn" id="logoutBtn">Log out</button>
      <button class="reset-btn" id="resetBtn" style="margin-top:7px;">Clear all data</button>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="loading">Loading your data…</div>
  </main>
</div>


  <script src="jszip.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
